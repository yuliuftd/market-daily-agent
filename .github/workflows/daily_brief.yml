name: Daily Market Intelligence Agent

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-market-agent:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # 关键：允许 Action 将每天新增的坐标点写回仓库
      issues: write

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 安装依赖库
        run: pip install -r requirements.txt

      - name: 4. 运行投研 Agent 并生成报告
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python main.py

      - name: 5. 增量保存今日新增的数据坐标点 (market_history.json)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f market_history.json ]; then
            git add market_history.json
            git diff --staged --quiet || git commit -m "chore(data): append daily market data point [skip ci]"
            git push
          fi